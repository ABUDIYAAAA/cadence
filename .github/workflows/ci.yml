name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Build, Vet, Unit & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Build binaries (api, migrate, seed, vapid)
        run: go build -v ./cmd/...

      - name: Run Unit Tests
        run: go test -v -race ./internal/... ./pkg/...

      - name: Run Testcontainers End-to-End Suite (Postgres, Redis, RabbitMQ, Mailpit)
        run: go test -v -race -count=1 -timeout 6m ./tests/e2e/...

name: Production Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    environment: production

    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          ENV_FILE: ${{ secrets.ENV }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Write .env to VPS
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "ubuntu@${VPS_HOST}" "mkdir -p ~/projects"
          printf '%s\n' "$ENV_FILE" | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "ubuntu@${VPS_HOST}" "cat > ~/projects/.cadence.env"

          # Clone/pull, migrate, seed, start containers, and prune images
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "ubuntu@${VPS_HOST}" << 'EOF'
            set -e
            if [ ! -d ~/projects/cadence/.git ]; then
              git clone https://github.com/ABUDIYAAAA/cadence.git ~/projects/cadence
            fi

            cd ~/projects/cadence
            git fetch origin main
            git reset --hard origin/main

            cd server
            mv ~/projects/.cadence.env .env
            chmod 600 .env

            export METRICS_SCRAPE_TOKEN=$(grep '^METRICS_SCRAPE_TOKEN=' .env | cut -d= -f2- | tr -d '\r"')

            docker compose --env-file .env -f docker-compose.prod.yml up -d db redis rabbitmq
            docker compose --env-file .env -f docker-compose.prod.yml build backend
            docker compose --env-file .env -f docker-compose.prod.yml run --rm --entrypoint /app/cadence-migrate backend
            docker compose --env-file .env -f docker-compose.prod.yml run --rm --entrypoint /app/cadence-seed backend
            docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
          EOF

          rm -f ~/.ssh/id_deploy

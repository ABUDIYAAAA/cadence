name: Production Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    environment: production

    steps:
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          ENV_FILE: ${{ secrets.ENV }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          trap 'rm -f ~/.ssh/id_deploy' EXIT

          SSH=(ssh -i ~/.ssh/id_deploy
            -o StrictHostKeyChecking=no
            -o ConnectTimeout=15)

          # Upload production environment.
          "${SSH[@]}" "ubuntu@${VPS_HOST}" 'mkdir -p ~/projects'
          printf '%s\n' "$ENV_FILE" |
            "${SSH[@]}" "ubuntu@${VPS_HOST}" 'cat > ~/projects/.cadence.env'

          # Deploy on the VPS.
          # The script is wrapped in main() so bash reads all of it before
          # running anything; otherwise a command that reads stdin can
          # swallow the rest of the script and the deploy exits 0 early.
          "${SSH[@]}" "ubuntu@${VPS_HOST}" 'bash -s' <<'REMOTE'
          main() {
          set -Eeuo pipefail

          cd ~/projects

          if [ ! -d cadence/.git ]; then
            git clone https://github.com/ABUDIYAAAA/cadence.git cadence
          fi

          cd cadence
          git fetch origin main
          git reset --hard origin/main
          cd server

          mv ~/projects/.cadence.env .env
          chmod 600 .env

          export METRICS_SCRAPE_TOKEN="$(
            sed -n 's/^METRICS_SCRAPE_TOKEN=//p' .env |
            head -n 1 | tr -d '\r"'
          )"

          dc() {
            docker compose --env-file .env \
              -f docker-compose.prod.yml "$@"
          }

          # Print useful diagnostics if any deployment command fails.
          trap 'echo "Deployment failed; collecting diagnostics"; dc ps -a || true; dc logs --tail=80 backend prometheus grafana || true' ERR

          dc config --quiet
          dc up -d db redis rabbitmq
          dc build backend

          dc run --rm -T --entrypoint /app/cadence-migrate backend </dev/null
          dc run --rm -T --entrypoint /app/cadence-seed backend </dev/null

          # Start every service declared in Compose.
          dc up -d --remove-orphans

          # Fail deployment if required application services are not running.
          for name in cadence-backend cadence-prometheus cadence-grafana; do
            for attempt in $(seq 1 10); do
              if [ "$(docker inspect -f '{{.State.Running}}' "$name" 2>/dev/null || true)" = "true" ]; then
                break
              fi
              sleep 2
            done

            if [ "$(docker inspect -f '{{.State.Running}}' "$name" 2>/dev/null || true)" != "true" ]; then
              echo "ERROR: $name did not remain running."
              dc ps -a
              dc logs --tail=100 backend prometheus grafana || true
              exit 1
            fi
          done

          echo "Deployment successful."
          dc ps -a
          docker image prune -f
          }
          main
          REMOTE

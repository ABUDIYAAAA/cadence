services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cadence-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8083}:${PORT:-8083}"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cadence-prod-net

  db:
    image: postgres:16-alpine
    container_name: cadence-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - cadence_prod_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cadence-prod-net

  redis:
    image: redis:7-alpine
    container_name: cadence-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - cadence_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cadence-prod-net

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: cadence-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - cadence_prod_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - cadence-prod-net

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: cadence-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - cadence_prod_prometheus_data:/prometheus
    secrets:
      - scrape_token
    depends_on:
      - backend
    networks:
      - cadence-prod-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: cadence-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3010}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.cadence.devclubxnst.com
      - GF_SERVER_DOMAIN=grafana.cadence.devclubxnst.com
      - GF_SERVER_PROTOCOL=http
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=no-reply@devclubxnst.com
      - GF_SMTP_FROM_NAME=Cadence Grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - cadence_prod_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - cadence-prod-net

secrets:
  scrape_token:
    environment: METRICS_SCRAPE_TOKEN

volumes:
  cadence_prod_db_data:
  cadence_prod_redis_data:
  cadence_prod_rabbitmq_data:
  cadence_prod_prometheus_data:
  cadence_prod_grafana_data:

networks:
  cadence-prod-net:
    driver: bridge

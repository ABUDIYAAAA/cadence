global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'cadence-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'cadence-backend'
          environment: 'development'

  - job_name: 'prometheus'
    basic_auth:
      username: 'admin'
      password: 'admin'
    static_configs:
      - targets: ['localhost:9090']
